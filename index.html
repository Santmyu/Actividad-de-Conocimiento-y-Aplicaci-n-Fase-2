<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Calculadora de Notas</h1>
      <p>Ingresa el nombre del estudiante y sus tres notas.</p>
    </header>

    <section class="formulario">
      <div class="campo">
        <label for="nombre">Nombre del estudiante</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
      </div>

      <div class="campo">
        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" class="nota" min="0" max="5" step="0.1" placeholder="0.0">
      </div>

      <div class="campo">
        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" class="nota" min="0" max="5" step="0.1" placeholder="0.0">
      </div>

      <div class="campo">
        <label for="nota3">Nota 3</label>
        <input type="number" id="nota3" class="nota" min="0" max="5" step="0.1" placeholder="0.0">
      </div>

      <div class="acciones">
        <button type="button" id="btn-calcular">Calcular promedio</button>
        <button type="button" id="btn-limpiar">Limpiar</button>
      </div>
    </section>

    <section class="resultado" id="resultado">
      <h2>Resultado</h2>
      <p>Estudiante: <span id="resultado-nombre">--</span></p>
      <p>Promedio: <span id="resultado-promedio">--</span></p>
      <p id="resultado-estado" class="estado"></p>
    </section>

    <footer>
      <small>Proyecto grupal - Calculadora de Notas</small>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
